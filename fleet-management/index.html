<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>混凝土企业车队管理系统</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --brand:#2563eb; --brand2:#3b82f6;
    --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; --info:#06b6d4;
    --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; min-height:100vh}
  /* Sidebar */
  .sidebar{
    width:230px; background:linear-gradient(180deg,#111827,#0b1220);
    border-right:1px solid var(--line); display:flex; flex-direction:column; flex-shrink:0;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{padding:20px 18px; border-bottom:1px solid var(--line)}
  .brand h1{font-size:16px; margin:0; display:flex; align-items:center; gap:8px}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#06b6d4);
    display:flex;align-items:center;justify-content:center;font-size:16px}
  .brand p{margin:6px 0 0; font-size:11px; color:var(--muted)}
  .nav{padding:10px 8px; flex:1}
  .nav .group{font-size:11px;color:var(--muted);padding:12px 12px 6px;letter-spacing:1px}
  .nav a{
    display:flex; align-items:center; gap:10px; padding:9px 12px; margin:2px 0;
    border-radius:8px; color:var(--muted); text-decoration:none; cursor:pointer; font-size:13.5px;
    transition:.15s;
  }
  .nav a:hover{background:var(--panel2); color:var(--text)}
  .nav a.active{background:var(--brand); color:#fff; font-weight:600}
  .nav a .ic{width:18px;text-align:center}
  .side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  /* Main */
  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 24px; border-bottom:1px solid var(--line); background:rgba(15,23,42,.7);
    position:sticky; top:0; z-index:20; backdrop-filter:blur(6px);
  }
  .topbar h2{margin:0;font-size:18px}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .content{padding:22px 24px; max-width:1400px; width:100%}
  /* Buttons */
  .btn{
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; display:inline-flex;
    align-items:center; gap:6px; transition:.15s;
  }
  .btn:hover{border-color:var(--brand2)}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600}
  .btn.primary:hover{background:#1d4ed8}
  .btn.danger{background:transparent;border-color:var(--danger);color:#fca5a5}
  .btn.danger:hover{background:rgba(239,68,68,.12)}
  .btn.sm{padding:5px 10px;font-size:12px}
  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
  .kpi .label{font-size:12.5px;color:var(--muted)}
  .kpi .val{font-size:28px;font-weight:700;margin-top:6px}
  .kpi .val small{font-size:13px;color:var(--muted);font-weight:400}
  .kpi .ic{position:absolute;right:14px;top:14px;font-size:22px;opacity:.35}
  .kpi.ok{border-left:3px solid var(--ok)} .kpi.warn{border-left:3px solid var(--warn)}
  .kpi.danger{border-left:3px solid var(--danger)} .kpi.info{border-left:3px solid var(--info)}
  .kpi.brand{border-left:3px solid var(--brand2)}
  /* Panels & grid */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
  .panel h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
  .panel .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel .hd h3{margin:0}
  /* Tables */
  .tablewrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0}
  tbody tr:hover{background:rgba(37,99,235,.07)}
  td .row-act{display:flex;gap:6px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  /* Badges */
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;line-height:18px}
  .badge.g{background:rgba(34,197,94,.15);color:#4ade80}
  .badge.y{background:rgba(245,158,11,.15);color:#fbbf24}
  .badge.r{background:rgba(239,68,68,.15);color:#f87171}
  .badge.b{background:rgba(59,130,246,.15);color:#60a5fa}
  .badge.c{background:rgba(6,182,212,.15);color:#22d3ee}
  .badge.m{background:rgba(148,163,184,.18);color:#cbd5e1}
  /* Toolbar */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .search{flex:1;min-width:180px;max-width:340px}
  input,select,textarea{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:8px 11px;border-radius:8px;font-size:13px;width:100%;font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2)}
  select{cursor:pointer}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:640px;box-shadow:var(--shadow)}
  .modal .mhd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal .mhd h3{margin:0;font-size:16px}
  .modal .mbd{padding:20px}
  .modal .close{cursor:pointer;font-size:22px;color:var(--muted);background:none;border:none}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.formgrid{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12px;color:var(--muted)}
  .field label .req{color:var(--danger)}
  .mft{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
  /* Progress bar */
  .bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:6px}
  /* Alert list */
  .alist{display:flex;flex-direction:column;gap:8px}
  .alert-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--panel2);font-size:13px}
  .alert-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .alert-item .txt{flex:1}
  .alert-item .txt small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
  /* score meter */
  .score-ring{display:flex;align-items:center;gap:14px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ok);color:#04250f;
    padding:11px 20px;border-radius:10px;font-weight:600;z-index:200;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.err{background:var(--danger);color:#fff}
  .hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
  /* Vehicle detail */
  .infogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .infogrid .it{background:var(--panel2);border-radius:9px;padding:10px 12px}
  .infogrid .it .l{font-size:11.5px;color:var(--muted)}
  .infogrid .it .v{font-size:14px;margin-top:3px;font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:5px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12.5px;transition:.15s}
  .chip:hover{border-color:var(--brand2)}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .qadd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .tl{position:relative;padding-left:6px}
  .tl:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:9px 0 9px 22px}
  .tl-item .node{position:absolute;left:0;top:13px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--brand2)}
  .tl-date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tl-body{font-size:13px;margin-top:3px;line-height:1.5}
  .mobile-only{display:none}
  @media(max-width:820px){
    .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.25s}
    .sidebar.open{transform:none}
    .mobile-only{display:inline-flex}
    .content{padding:16px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1><span class="logo">🚛</span> 车队管理系统</h1>
      <p>混凝土企业运输管理平台</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div>数据存储：本地浏览器</div>
      <div style="margin-top:6px">
        <a onclick="exportData()" style="color:#60a5fa;cursor:pointer">导出</a> ·
        <a onclick="importData()" style="color:#60a5fa;cursor:pointer">导入</a> ·
        <a onclick="resetData()" style="color:#f87171;cursor:pointer">重置</a>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn sm mobile-only" onclick="toggleSidebar()">☰</button>
        <div>
          <h2 id="pageTitle">数据看板</h2>
          <div class="sub" id="pageSub">车队运营概览</div>
        </div>
      </div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mhd">
      <h3 id="modalTitle">编辑</h3>
      <button class="close" onclick="closeModal()">&times;</button>
    </div>
    <div class="mbd"><div class="formgrid" id="formGrid"></div></div>
    <div class="mft">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json" style="display:none">

<script>
/* ============================================================
   混凝土企业车队管理系统 —— 数据驱动的单页应用
   模块：数据看板 / 车队管理 / 车队卫生 / 车队安全
   数据持久化：localStorage（本地浏览器）
   ============================================================ */

const DB_KEY = 'concrete_fleet_db_v1';
const VEHICLE_TYPES = ['搅拌车','混凝土泵车','自卸车','水泥罐车','装载机','铲车','工程车','其他'];
const CONCRETE_GRADES = ['C15','C20','C25','C30','C35','C40','C45','C50','C60'];

/* ---------- 表结构定义（Schema 驱动 CRUD） ---------- */
const schemas = {
  vehicles: {
    title:'车辆台账', icon:'🚛', group:'车队管理',
    sub:'车辆基础信息、证件与状态管理',
    seq:'C', // 编号前缀
    detail:true, // 支持"车辆档案"详情汇总页
    fields:[
      {k:'plate', label:'车牌号', type:'text', req:true, w:110},
      {k:'type', label:'车辆类型', type:'select', opts:VEHICLE_TYPES, req:true},
      {k:'model', label:'品牌型号', type:'text'},
      {k:'capacity', label:'方量/载重', type:'text', hint:'如 12m³ 或 30t'},
      {k:'buyDate', label:'购置日期', type:'date'},
      {k:'mileage', label:'当前里程(km)', type:'number'},
      {k:'driver', label:'责任司机', type:'text'},
      {k:'licenseExp', label:'行驶证到期', type:'date'},
      {k:'insuranceExp', label:'保险到期', type:'date'},
      {k:'inspectExp', label:'年检到期', type:'date'},
      {k:'status', label:'状态', type:'select', opts:['在用','在途','维保中','停用'], req:true, badge:{'在用':'g','在途':'c','维保中':'y','停用':'m'}},
      {k:'note', label:'备注', type:'textarea', full:true},
    ],
    columns:['plate','type','model','capacity','driver','mileage','status'],
  },
  drivers: {
    title:'司机档案', icon:'👷', group:'车队管理',
    sub:'驾驶员信息、证件与安全评分',
    seq:'D',
    fields:[
      {k:'name', label:'姓名', type:'text', req:true},
      {k:'phone', label:'联系电话', type:'text'},
      {k:'idcard', label:'身份证号', type:'text'},
      {k:'licenseType', label:'准驾车型', type:'select', opts:['A1','A2','A3','B1','B2','C1']},
      {k:'licenseExp', label:'驾照到期', type:'date'},
      {k:'qualExp', label:'从业资格证到期', type:'date'},
      {k:'joinDate', label:'入职日期', type:'date'},
      {k:'bindVehicle', label:'绑定车辆', type:'text'},
      {k:'safeScore', label:'安全评分', type:'number', hint:'0-100', badgeScore:true},
      {k:'status', label:'状态', type:'select', opts:['在职','休假','离职'], badge:{'在职':'g','休假':'y','离职':'m'}},
    ],
    columns:['name','phone','licenseType','bindVehicle','safeScore','status'],
  },
  dispatch: {
    title:'运输任务/派车', icon:'📋', group:'车队管理',
    sub:'混凝土运输任务派单与跟踪',
    seq:'T',
    fields:[
      {k:'date', label:'任务日期', type:'date', req:true, default:'today'},
      {k:'project', label:'工程项目', type:'text', req:true},
      {k:'vehicle', label:'车辆', type:'text', req:true},
      {k:'driver', label:'司机', type:'text'},
      {k:'grade', label:'混凝土标号', type:'select', opts:CONCRETE_GRADES},
      {k:'volume', label:'方量(m³)', type:'number'},
      {k:'departTime', label:'出发时间', type:'time'},
      {k:'arriveTime', label:'送达时间', type:'time'},
      {k:'address', label:'送达地址', type:'text', full:true},
      {k:'status', label:'状态', type:'select', opts:['待派车','运输中','已送达','已退单'], req:true, badge:{'待派车':'m','运输中':'c','已送达':'g','已退单':'r'}},
    ],
    columns:['date','project','vehicle','driver','grade','volume','status'],
  },
  maintenance: {
    title:'维保保养', icon:'🔧', group:'车队管理',
    sub:'车辆维修、保养与年检记录',
    seq:'M',
    fields:[
      {k:'date', label:'日期', type:'date', req:true, default:'today'},
      {k:'vehicle', label:'车辆', type:'text', req:true},
      {k:'type', label:'类型', type:'select', opts:['常规保养','故障维修','轮胎更换','年检','事故维修'], req:true},
      {k:'mileage', label:'当时里程(km)', type:'number'},
      {k:'cost', label:'费用(元)', type:'number'},
      {k:'nextDate', label:'下次保养日期', type:'date'},
      {k:'garage', label:'维修单位', type:'text'},
      {k:'detail', label:'维保内容', type:'textarea', full:true},
    ],
    columns:['date','vehicle','type','mileage','cost','nextDate'],
  },
  fuel: {
    title:'里程油耗', icon:'⛽', group:'车队管理',
    sub:'加油记录与百公里油耗统计',
    seq:'F',
    fields:[
      {k:'date', label:'日期', type:'date', req:true, default:'today'},
      {k:'vehicle', label:'车辆', type:'text', req:true},
      {k:'mileage', label:'当前里程(km)', type:'number'},
      {k:'runKm', label:'本次行驶(km)', type:'number'},
      {k:'liters', label:'加油量(L)', type:'number'},
      {k:'price', label:'单价(元/L)', type:'number'},
      {k:'amount', label:'金额(元)', type:'number'},
      {k:'note', label:'备注', type:'text', full:true},
    ],
    columns:['date','vehicle','runKm','liters','amount','_consume'],
  },
  outDriver: {
    title:'外调司机费用', icon:'💰', group:'车队管理',
    sub:'每日外调 / 外协司机派工与费用结算',
    seq:'OD',
    summary:true,
    fields:[
      {k:'date', label:'日期', type:'date', req:true, default:'today'},
      {k:'name', label:'司机姓名', type:'text', req:true},
      {k:'phone', label:'联系电话', type:'text'},
      {k:'company', label:'外协单位/来源', type:'text', hint:'如个人/某车队'},
      {k:'plate', label:'车牌号', type:'text'},
      {k:'project', label:'工程项目', type:'text'},
      {k:'billType', label:'计费方式', type:'select', opts:['按天','按趟','按方']},
      {k:'trips', label:'趟数', type:'number'},
      {k:'volume', label:'方量(m³)', type:'number'},
      {k:'unitPrice', label:'单价(元)', type:'number', hint:'元/天·趟·方'},
      {k:'amount', label:'费用金额(元)', type:'number', req:true},
      {k:'settle', label:'结算状态', type:'select', opts:['待结算','已结算'], req:true, badge:{'待结算':'y','已结算':'g'}},
      {k:'note', label:'备注', type:'textarea', full:true},
    ],
    columns:['date','name','company','project','billType','trips','amount','settle'],
  },
  cleaning: {
    title:'清洗记录', icon:'🚿', group:'车队卫生',
    sub:'罐体冲洗、车身清洗与驾驶室清洁',
    seq:'CL',
    fields:[
      {k:'date', label:'日期', type:'date', req:true, default:'today'},
      {k:'vehicle', label:'车辆', type:'text', req:true},
      {k:'type', label:'清洗类型', type:'select', opts:['罐体冲洗','车身清洗','驾驶室清洁','轮胎除泥','综合保洁'], req:true},
      {k:'worker', label:'清洗人', type:'text'},
      {k:'residue', label:'残料清理', type:'select', opts:['已清理','无残料','未清理']},
      {k:'score', label:'卫生评分', type:'number', hint:'0-100', badgeScore:true},
      {k:'note', label:'备注', type:'textarea', full:true},
    ],
    columns:['date','vehicle','type','worker','residue','score'],
  },
  hygiene: {
    title:'卫生检查', icon:'✨', group:'车队卫生',
    sub:'定期卫生检查评分与问题整改',
    seq:'HY',
    fields:[
      {k:'date', label:'检查日期', type:'date', req:true, default:'today'},
      {k:'vehicle', label:'车辆', type:'text', req:true},
      {k:'inspector', label:'检查人', type:'text'},
      {k:'body', label:'车容车貌', type:'select', opts:['优','良','中','差']},
      {k:'tank', label:'罐体清洁', type:'select', opts:['优','良','中','差']},
      {k:'cab', label:'驾驶室卫生', type:'select', opts:['优','良','中','差']},
      {k:'env', label:'防遗撒/环保', type:'select', opts:['合格','不合格']},
      {k:'score', label:'综合评分', type:'number', hint:'0-100', badgeScore:true},
      {k:'result', label:'检查结果', type:'select', opts:['合格','限期整改','不合格'], badge:{'合格':'g','限期整改':'y','不合格':'r'}},
      {k:'problem', label:'问题描述', type:'textarea', full:true},
    ],
    columns:['date','vehicle','inspector','score','env','result'],
  },
  safetyCheck: {
    title:'安全检查', icon:'🛡️', group:'车队安全',
    sub:'车辆安全检查表（出车前/定期）',
    seq:'SC',
    fields:[
      {k:'date', label:'检查日期', type:'date', req:true, default:'today'},
      {k:'vehicle', label:'车辆', type:'text', req:true},
      {k:'inspector', label:'检查人', type:'text'},
      {k:'brake', label:'制动系统', type:'select', opts:['正常','异常']},

  for(const k in schemas){ if(!Array.isArray(DB[k])){ DB[k]=[]; changed=true; } }

  if(changed) saveDB();
}

function today(){ return new Date().toISOString().slice(0,10); }
function daysBetween(d){ if(!d) return null; return Math.ceil((new Date(d)-new Date(today()))/86400000); }

/* ---------- 渲染：导航 ---------- */
let currentView='dashboard';
function renderNav(){
  const nav=document.getElementById('nav');
  let html='';
  navConfig.forEach(sec=>{
    if(sec.group) html+=`<div class="group">${sec.group}</div>`;
    sec.items.forEach(it=>{
      if(typeof it==='string'){
        const s=schemas[it];
        html+=navLink(it, s.icon, s.title);
      }else{
        html+=navLink(it.key, it.icon, it.title);
      }
    });
  });
  nav.innerHTML=html;
}
function navLink(key,icon,title){
  const cnt = schemas[key] ? `` : '';
  return `<a class="${key===currentView?'active':''}" onclick="go('${key}')"><span class="ic">${icon}</span> ${title}</a>`;
}

function go(view){
  currentView=view;
  document.getElementById('sidebar').classList.remove('open');
  renderNav();
  if(view==='dashboard'){ renderDashboard(); }
  else if(view==='consumption'){ renderConsumption(); }
  else{ renderCollection(view); }
  window.scrollTo(0,0);
}

  const todayVol=todayTasks.reduce((s,x)=>s+(+x.volume||0),0);
  const openHazard=DB.hazard.filter(x=>x.status==='待整改'||x.status==='整改中').length;
  const todayOut=DB.outDriver.filter(x=>x.date===today());
  const todayOutSum=todayOut.reduce((s,x)=>s+(+x.amount||0),0);

  // 证件/保养到期预警（30天内或已过期）
  const alerts=[];
  const pushExp=(name,label,d)=>{ const dd=daysBetween(d); if(dd!==null && dd<=30){ alerts.push({name,label,days:dd,d}); } };
  v.forEach(x=>{
    pushExp(x.plate,'行驶证',x.licenseExp);
    pushExp(x.plate,'保险',x.insuranceExp);
    pushExp(x.plate,'年检',x.inspectExp);
  });
  DB.drivers.forEach(x=>{ pushExp(x.name,'驾照',x.licenseExp); pushExp(x.name,'从业资格证',x.qualExp); });
  DB.maintenance.forEach(x=>{ if(x.nextDate) pushExp(x.vehicle,'保养到期',x.nextDate); });
  alerts.sort((a,b)=>a.days-b.days);

  // 卫生 & 安全评分
  const hyScores=DB.hygiene.map(x=>+x.score||0).filter(Boolean);
  const hyAvg=hyScores.length?Math.round(hyScores.reduce((a,b)=>a+b,0)/hyScores.length):0;

      <div class="kpi info"><div class="label">今日运输任务</div><div class="val">${todayTasks.length}<small> 单 · ${todayVol}m³</small></div><div class="ic">📋</div></div>
      <div class="kpi ${openHazard?'danger':'ok'}"><div class="label">待整改安全隐患</div><div class="val">${openHazard}<small> 项</small></div><div class="ic">⚠️</div></div>
      <div class="kpi info"><div class="label">今日外调司机费用</div><div class="val">¥${todayOutSum.toLocaleString()}<small> · ${todayOut.length}人次</small></div><div class="ic">💰</div></div>
    </div>

    <div class="grid2">
      <div class="panel">
        <div class="hd"><h3>⏰ 证件 / 保养到期预警</h3><span class="badge ${alerts.length?'y':'g'}">${alerts.length} 项</span></div>
        <div class="hint">30天内到期或已过期的证件与保养提醒</div>
        <div class="alist">
          ${alerts.length? alerts.slice(0,12).map(a=>{
            const overdue=a.days<0;
            const color=overdue?'var(--danger)':a.days<=7?'var(--warn)':'var(--info)';
            return `<div class="alert-item"><span class="dot" style="background:${color}"></span>

function renderTypeStat(){
  const counts={};
  DB.vehicles.forEach(v=>counts[v.type]=(counts[v.type]||0)+1);
  const max=Math.max(1,...Object.values(counts));
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return `<div class="empty">暂无车辆</div>`;
  return `<div class="alist">${entries.map(([t,n])=>`
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:90px;font-size:13px">${t}</div>
      <div class="bar" style="flex:1"><i style="width:${n/max*100}%;background:var(--brand2)"></i></div>
      <b style="width:30px;text-align:right">${n}</b>
    </div>`).join('')}</div>`;
}

function buildEvents(plate){
  let events=[];
  activitySources.forEach(s=>{
    DB[s.k].filter(r=>r.vehicle===plate).forEach(r=>{
      events.push({date:r.date||'', icon:s.icon, label:s.label, color:s.color, text:s.fmt(r), srcKey:s.k, srcLabel:s.label, id:r._id});
    });
  });
  events.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return events;
}
function renderTimeline(){
  const v=DB.vehicles.find(x=>x._id===detailVehicleId); if(!v) return;
  const all=buildEvents(v.plate);
  // 筛选 chips：全部 + 各来源(有记录的)
  const present=[...new Set(all.map(e=>e.srcKey))];
  const chipDefs=[{k:'all',label:'全部',icon:'📋'}].concat(activitySources.filter(s=>present.includes(s.k)).map(s=>({k:s.k,label:s.label,icon:s.icon})));
  document.getElementById('tlChips').innerHTML=chipDefs.map(c=>
    `<div class="chip ${detailFilter===c.k?'active':''}" onclick="setTlFilter('${c.k}')">${c.icon} ${c.label}</div>`).join('');
  const list=detailFilter==='all'?all:all.filter(e=>e.srcKey===detailFilter);
  document.getElementById('tlCount').textContent='共 '+list.length+' 条';
  document.getElementById('tlArea').innerHTML= list.length? `<div class="tl">${list.map(e=>`
    <div class="tl-item"><span class="node"></span>
      <div class="tl-date">${fmtDate(e.date)}</div>
      <div class="tl-body">${e.icon} <span class="badge ${e.color}">${e.srcLabel}</span> ${escapeHtml(e.text)}
        <a onclick="openModal('${e.srcKey}','${e.id}')" style="color:#60a5fa;cursor:pointer;margin-left:6px;font-size:12px">编辑</a></div>
    </div>`).join('')}</div>` : `<div class="empty">📭 该车暂无相关记录，可用上方「快速登记」添加</div>`;
}
function setTlFilter(k){ detailFilter=k; renderTimeline(); }
function quickAdd(key, vehicleId, plate){
  afterSaveVehicle=vehicleId;
  openModal(key, null, {vehicle:plate, date:today()});
}

/* ---------- 油耗消耗分析（按月统计每台车里程/加油/油耗） ---------- */
let consumptionMonth=null;
// 根据一组加油记录计算月里程（优先累加"本次行驶km"，否则用里程表最大-最小估算）
function calcKm(recs){
  let km=recs.reduce((s,r)=>s+(+r.runKm||0),0);
  if(!km){ const ms=recs.map(r=>+r.mileage||0).filter(Boolean); if(ms.length>=2) km=Math.max(...ms)-Math.min(...ms); }
  return km;
}
function consumeStats(plate, month){
  const recs=DB.fuel.filter(r=>r.vehicle===plate && (r.date||'').slice(0,7)===month);
  const km=calcKm(recs);
  const liters=recs.reduce((s,r)=>s+(+r.liters||0),0);
  const amount=recs.reduce((s,r)=>s+(+r.amount||0),0);
  return {times:recs.length, km, liters, amount, l100: km>0?liters/km*100:null, perKm: km>0?amount/km:null};
}
function l100Badge(v){ return `<span class="badge ${v>45?'r':v>35?'y':'g'}">${Number(v).toFixed(1)}</span>`; }
function nfmt(n,d=0){ return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d}); }

function renderConsumption(){
  detailVehicleId=null;
  document.getElementById('pageTitle').textContent='📉 油耗消耗分析';
  document.getElementById('pageSub').textContent='按月统计每台车的里程、加油量与油耗';
  const months=[...new Set(DB.fuel.map(r=>(r.date||'').slice(0,7)).filter(Boolean))];
  months.push(today().slice(0,7));
  const opts=[...new Set(months)].sort().reverse();
  if(!consumptionMonth||!opts.includes(consumptionMonth)) consumptionMonth=opts[0];
  const month=consumptionMonth;
  document.getElementById('topActions').innerHTML=
    `<select style="width:auto" onchange="setConsumptionMonth(this.value)">`+
    opts.map(m=>`<option value="${m}" ${m===month?'selected':''}>${m.replace('-','年')}月</option>`).join('')+`</select>`;

  const plates=[...new Set(DB.vehicles.map(v=>v.plate).concat(DB.fuel.map(r=>r.vehicle)))].filter(Boolean);
  const data=[];
  plates.forEach(plate=>{
    const st=consumeStats(plate, month);
    if(!st.times) return;
    const veh=DB.vehicles.find(v=>v.plate===plate);
    data.push({plate, type:veh?veh.type:'外部车', ...st});
  });
  data.sort((a,b)=>b.liters-a.liters);

  const tKm=data.reduce((s,r)=>s+r.km,0), tL=data.reduce((s,r)=>s+r.liters,0), tAmt=data.reduce((s,r)=>s+r.amount,0);
  const avg=tKm>0? tL/tKm*100 : 0;
  const dash='<span style="color:#64748b">—</span>';
  const missKm='<span class="badge m">缺里程</span>';

  let table;
  if(!data.length){
    table=`<div class="empty">📭 ${month} 暂无加油记录。<br>请到「里程油耗」登记加油（记得填「本次行驶km」），这里就会自动算出每台车的油耗。</div>`;
  }else{
    table=`<div class="tablewrap"><table><thead><tr>
      <th>车辆</th><th>车型</th><th>加油次数</th><th>月里程(km)</th><th>加油量(L)</th><th>油费(¥)</th><th>百公里油耗(L)</th><th>每公里油费(¥)</th>
    </tr></thead><tbody>${data.map(r=>`<tr>
      <td><b>${r.plate}</b></td><td>${r.type}</td>
      <td style="font-variant-numeric:tabular-nums">${r.times}</td>
      <td style="font-variant-numeric:tabular-nums">${r.km?nfmt(r.km):dash}</td>
      <td style="font-variant-numeric:tabular-nums">${nfmt(r.liters,1)}</td>
      <td style="font-variant-numeric:tabular-nums">${nfmt(r.amount)}</td>
      <td>${r.l100!==null?l100Badge(r.l100):missKm}</td>
      <td style="font-variant-numeric:tabular-nums">${r.perKm!==null?nfmt(r.perKm,2):dash}</td>
    </tr>`).join('')}
    <tr style="font-weight:700;background:var(--panel2)">
      <td colspan="3">合计 / 车队平均</td>
      <td style="font-variant-numeric:tabular-nums">${nfmt(tKm)}</td>
      <td style="font-variant-numeric:tabular-nums">${nfmt(tL,1)}</td>
      <td style="font-variant-numeric:tabular-nums">${nfmt(tAmt)}</td>
      <td>${tKm>0?l100Badge(avg):dash}</td>
      <td style="font-variant-numeric:tabular-nums">${tKm>0?nfmt(tAmt/tKm,2):dash}</td>
    </tr></tbody></table></div>`;
  }

  document.getElementById('content').innerHTML=`
    <div class="kpis">
      <div class="kpi brand"><div class="label">本月总里程</div><div class="val">${nfmt(tKm)}<small> km</small></div><div class="ic">🛣️</div></div>
      <div class="kpi info"><div class="label">本月总加油</div><div class="val">${nfmt(tL)}<small> L</small></div><div class="ic">⛽</div></div>
      <div class="kpi warn"><div class="label">本月总油费</div><div class="val">¥${nfmt(tAmt)}</div><div class="ic">💴</div></div>
      <div class="kpi ok"><div class="label">车队平均油耗</div><div class="val">${nfmt(avg,1)}<small> L/100km</small></div><div class="ic">📉</div></div>
    </div>
    <div class="panel">
      <div class="hd"><h3>📉 各车月度消耗（${month.replace('-','年')}月）</h3></div>
      <div class="hint">月里程 = 各次「本次行驶km」之和（未填则用里程表最大−最小估算）；百公里油耗 = 加油量 ÷ 月里程 × 100；颜色：绿≤35 · 黄35-45 · 红>45。</div>
      ${table}
    </div>`;
}
function setConsumptionMonth(m){ consumptionMonth=m; renderConsumption(); }

/* ---------- 通用集合视图（列表 + 增删改查） ---------- */
let searchTerm='';
function renderCollection(key){
  const s=schemas[key];

  document.getElementById('pageSub').textContent=s.sub;

        <span class="badge m" id="countBadge">共 ${rows.length} 条</span>
      </div>
      <div id="tableArea">${renderTable(key, rows, true)}</div>

}
function renderCollectionSummary(key){
  if(key!=='outDriver') return '';
  const rows=DB.outDriver;
  const t=today(), month=t.slice(0,7);
  const sum=arr=>arr.reduce((s,r)=>s+(+r.amount||0),0);
  const todayRows=rows.filter(r=>r.date===t);
  const todaySum=sum(todayRows);
  const monthSum=sum(rows.filter(r=>(r.date||'').slice(0,7)===month));
  const unpaid=sum(rows.filter(r=>r.settle==='待结算'));
  return `<div class="kpis">
    <div class="kpi brand"><div class="label">今日外调费用</div><div class="val">¥${todaySum.toLocaleString()}</div><div class="ic">💰</div></div>
    <div class="kpi info"><div class="label">今日外调人次</div><div class="val">${todayRows.length}<small> 人次</small></div><div class="ic">👷</div></div>
    <div class="kpi ok"><div class="label">本月累计费用</div><div class="val">¥${monthSum.toLocaleString()}</div><div class="ic">📅</div></div>
    <div class="kpi ${unpaid?'warn':'ok'}"><div class="label">待结算金额</div><div class="val">¥${unpaid.toLocaleString()}</div><div class="ic">⏳</div></div>
  </div>`;
}
function onSearch(key){
  searchTerm=document.getElementById('searchInput').value.trim().toLowerCase();
  const rows=filterRows(key);
  document.getElementById('tableArea').innerHTML=renderTable(key, rows, true);
  document.getElementById('countBadge').textContent='共 '+rows.length+' 条';
}
function filterRows(key){
  const rows=DB[key];
  if(!searchTerm) return rows;
  return rows.filter(r=>Object.values(r).some(val=>String(val).toLowerCase().includes(searchTerm)));
}

function cellValue(key, field, row){
  const f=schemas[key].fields.find(x=>x.k===field);
  // 计算列：百公里油耗
  if(field==='_consume'){
    const km=+row.runKm||0, l=+row.liters||0;
    return km>0? `<b>${(l/km*100).toFixed(1)}</b> L/100km` : '—';
  }
  let val=row[field];
  if(val===undefined||val===null||val==='') return '<span style="color:#64748b">—</span>';
  if(f&&f.badge&&f.badge[val]) return `<span class="badge ${f.badge[val]}">${val}</span>`;
  if(f&&f.badgeScore){ const n=+val; const c=n>=90?'g':n>=75?'y':'r'; return `<span class="badge ${c}">${val}</span>`; }
  // 日期到期高亮
  if(f&&f.type==='date'&&/Exp$|Date$|deadline/.test(field) && !/buyDate|joinDate/.test(field)){
    const dd=daysBetween(val);
    if(dd!==null){
      if(dd<0) return `${val} <span class="badge r">逾期</span>`;
      if(dd<=30) return `${val} <span class="badge y">${dd}天</span>`;
    }
  }
  return String(val);
}

function renderTable(key, rows, withActions){
  const s=schemas[key];
  const cols=s.columns;
  const head=cols.map(c=>{
    if(c==='_consume') return '<th>百公里油耗</th>';
    const f=s.fields.find(x=>x.k===c);
    return `<th>${f?f.label:c}</th>`;
  }).join('')+(withActions?`<th style="width:${s.detail?190:110}px">操作</th>`:'');
  if(!rows.length){
    return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead></table><div class="empty">📭 暂无数据${withActions?'，点击右上角"新增"添加':''}</div></div>`;
  }
  const body=rows.map(r=>{
    const tds=cols.map(c=>`<td>${cellValue(key,c,r)}</td>`).join('');
    const detailBtn = s.detail ? `<button class="btn sm primary" onclick="openVehicle('${r._id}')">档案</button>` : '';
    const act=withActions?`<td><div class="row-act">
      ${detailBtn}
      <button class="btn sm" onclick="openModal('${key}','${r._id}')">编辑</button>
      <button class="btn sm danger" onclick="delRecord('${key}','${r._id}')">删</button>
    </div></td>`:'';
    return `<tr>${tds}${act}</tr>`;
  }).join('');
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- 表单弹窗 ---------- */
let editing={key:null,id:null};
function openModal(key,id,preset){
  const s=schemas[key];
  editing={key,id:id||null};
  const row = id ? DB[key].find(x=>x._id===id) : (preset||{});
  document.getElementById('modalTitle').textContent=(id?'编辑 ':'新增 ')+s.title;
  const grid=document.getElementById('formGrid');
  grid.innerHTML=s.fields.map(f=>{
    let def = row[f.k];
    if(def===undefined && f.default==='today') def=today();
    def = def===undefined?'':def;
    const req=f.req?'<span class="req"> *</span>':'';
    const hint=f.hint?` <span style="color:#64748b">(${f.hint})</span>`:'';
    let input;
    if(f.type==='select'){
      input=`<select data-k="${f.k}"><option value="">请选择</option>${f.opts.map(o=>`<option ${o===def?'selected':''}>${o}</option>`).join('')}</select>`;
    }else if(f.type==='textarea'){
      input=`<textarea data-k="${f.k}" rows="2">${escapeHtml(def)}</textarea>`;
    }else{
      input=`<input data-k="${f.k}" type="${f.type}" value="${escapeHtml(def)}">`;
    }
    return `<div class="field ${(f.full||f.type==='textarea')?'full':''}"><label>${f.label}${req}${hint}</label>${input}</div>`;
  }).join('');
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ afterSaveVehicle=null; document.getElementById('overlay').classList.remove('show'); }
function saveRecord(){
  const {key,id}=editing;
  const s=schemas[key];
  const inputs=document.querySelectorAll('#formGrid [data-k]');
  const data={};
  inputs.forEach(el=>data[el.dataset.k]=el.value.trim());
  // 必填校验
  for(const f of s.fields){ if(f.req && !data[f.k]){ toast('请填写：'+f.label, true); return; } }
  if(id){
    const idx=DB[key].findIndex(x=>x._id===id);
    DB[key][idx]={...DB[key][idx],...data};
    toast('已更新');
  }else{
    data._id=genId(s.seq||'R');
    DB[key].unshift(data);
    toast('已新增');
  }
  saveDB(); closeModal();
  if(afterSaveVehicle){ const vid=afterSaveVehicle; afterSaveVehicle=null; openVehicle(vid); }
  else if(detailVehicleId && currentView==='vehicles' && document.getElementById('tlArea')){ openVehicle(detailVehicleId); }
  else go(key);
}
function delRecord(key,id){
  if(!confirm('确认删除该记录？此操作不可撤销。')) return;
  DB[key]=DB[key].filter(x=>x._id!==id);
  saveDB(); toast('已删除');
  if(currentView==='dashboard') renderDashboard();
  else if(detailVehicleId && document.getElementById('tlArea')) openVehicle(detailVehicleId);
  else if(schemas[key] && schemas[key].summary) go(key);
  else onSearchSafe(key);
}
function onSearchSafe(key){
  const inp=document.getElementById('searchInput');
  if(inp){ onSearch(key); } else { go(key); }
}

/* ---------- 工具 ---------- */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(err?' err':'');
  setTimeout(()=>t.className='toast'+(err?' err':''),1800);
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

/* ---------- 数据导入导出 ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='车队数据_'+today()+'.json';
  a.click();
  toast('数据已导出');
}
function importData(){ document.getElementById('importFile').click(); }
document.getElementById('importFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const obj=JSON.parse(ev.target.result);
      for(const k in schemas){ if(!Array.isArray(obj[k])) obj[k]=DB[k]||[]; }
      DB=obj; DB._seeded=true; saveDB();
      toast('数据导入成功'); go(currentView);
    }catch(err){ toast('导入失败：文件格式错误',true); }
  };
  reader.readAsText(file);
  e.target.value='';
});
function resetData(){
  if(!confirm('确认清空所有数据并恢复演示数据？此操作不可撤销。')) return;
  localStorage.removeItem(DB_KEY); loadDB(); toast('已重置'); go('dashboard');
}

/* ---------- 启动 ---------- */
loadDB();
renderNav();
go('dashboard');
</script>
</body>
</html>
