<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>原材料进销存 · 混凝土搅拌站</title>
<style>
  :root{
    --bg:#0f1720; --panel:#17212b; --panel2:#1e2b38; --line:#2a3a4a;
    --txt:#e6edf3; --muted:#8aa0b4; --accent:#3d8bff; --accent2:#2563eb;
    --ok:#2ec27e; --warn:#f5a623; --bad:#ff5c5c; --chip:#22303d;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f2f5f8; --panel:#ffffff; --panel2:#f7f9fb; --line:#e2e8ef;
      --txt:#1a2530; --muted:#617489; --chip:#eef3f8; --shadow:0 4px 18px rgba(20,40,70,.08);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  header.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:10px 18px;box-shadow:var(--shadow)}
  header .logo{font-weight:700;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:8px}
  header .logo .dot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
  header .plant{color:var(--muted);font-size:13px;border-left:1px solid var(--line);padding-left:14px}
  header .spacer{flex:1}
  header .tools{display:flex;gap:8px;flex-wrap:wrap}
  nav.tabs{display:flex;gap:4px;padding:8px 12px 0;background:var(--panel);border-bottom:1px solid var(--line);
    overflow-x:auto;position:sticky;top:53px;z-index:19}
  nav.tabs button{background:transparent;border:none;color:var(--muted);padding:9px 14px;border-radius:8px 8px 0 0;
    cursor:pointer;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
  nav.tabs button:hover{color:var(--txt);background:var(--panel2)}
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  main{max-width:1180px;margin:0 auto;padding:18px}
  .btn{background:var(--accent2);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;
    display:inline-flex;align-items:center;gap:6px}
  .btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:var(--chip);color:var(--txt);border:1px solid var(--line)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
  .btn.danger:hover{background:rgba(255,92,92,.12)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:16px} .card .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .kpi .name{color:var(--muted);font-size:12.5px}
  .kpi .val{font-size:23px;font-weight:700;margin-top:6px}
  .kpi .unit{font-size:13px;color:var(--muted);font-weight:400;margin-left:3px}
  .kpi .meta{font-size:12px;color:var(--muted);margin-top:4px}
  .kpi.alert{border-color:var(--bad)} .kpi.alert .bar{background:var(--bad)}
  .kpi.low{border-color:var(--warn)} .kpi.low .bar{background:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  thead th{color:var(--muted);font-weight:600;font-size:12px;background:var(--panel2);position:sticky;top:0}
  tbody tr:hover{background:var(--panel2)}
  tfoot td{font-weight:600;border-top:2px solid var(--line)}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-items:end}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
  label.field span b{color:var(--bad);font-weight:400}
  input,select,textarea{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:14px;font-family:inherit;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  input[readonly]{color:var(--muted);background:var(--chip)}
  table input{padding:5px 7px;font-size:13px;text-align:right}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--chip);border:1px solid var(--line)}
  .tag{padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
  .tag.ok{background:rgba(46,194,126,.15);color:var(--ok)}
  .tag.warn{background:rgba(245,166,35,.15);color:var(--warn)}
  .tag.bad{background:rgba(255,92,92,.15);color:var(--bad)}
  .tag.mut{background:var(--chip);color:var(--muted)}
  .num{font-variant-numeric:tabular-nums}
  .pos{color:var(--bad)} .neg{color:var(--ok)} .muted{color:var(--muted)}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .empty{padding:36px;text-align:center;color:var(--muted)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
  .toolbar .spacer{flex:1}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--txt);padding:0;
    box-shadow:var(--shadow);max-width:620px;width:94vw}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog .dhead{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center}
  dialog .dbody{padding:18px;max-height:70vh;overflow:auto}
  dialog .dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .close{margin-left:auto;background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .hint{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
    padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:99;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .split{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:820px){.split.two{grid-template-columns:1fr 1fr}}
  .mat-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--accent);margin-right:5px}
  @media print{header.topbar,nav.tabs,.toolbar,.row-actions,.btn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><span class="dot"></span> 原材料进销存</div>
  <div class="plant" id="plantName" title="点击修改站名" style="cursor:pointer">未命名搅拌站</div>
  <div class="spacer"></div>
  <div class="tools">
    <button class="btn ghost sm" onclick="exportBackup()">导出备份</button>
    <button class="btn ghost sm" onclick="document.getElementById('importFile').click()">恢复备份</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(this)"/>
    <button class="btn ghost sm" onclick="loadDemo()">示例数据</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <form method="dialog">
    <div class="dhead"><span id="dlgTitle">编辑</span><button type="button" class="close" onclick="document.getElementById('dlg').close()">×</button></div>
    <div class="dbody" id="dlgBody"></div>
    <div class="dfoot">
      <button type="button" class="btn ghost" onclick="document.getElementById('dlg').close()">取消</button>
      <button type="button" class="btn" id="dlgSave">保存</button>
    </div>
  </form>
</dialog>

<script>
/* =========================================================================
   原材料进销存 — 混凝土搅拌站（单文件，数据存浏览器 localStorage）
   口径贴合日报表：理论应耗 = 配料主机「电脑消耗」；进厂 = 过磅入库
   账面库存 = 期初 + 进厂 − 电脑消耗（滚动结转，遇盘点则以实盘为新基准）
   损耗 = 实际消耗(期初+进厂−期末实盘) − 电脑消耗；超阈值或账面倒挂即预警
   ========================================================================= */
const LS_KEY = "rmi_inventory_v2";

/* 默认材料按“大类”（合并各仓/线）。unit=吨。lossThreshold=损耗率预警阈值(%)
   aliases 用于粘贴导入时把原始列名（如“1线水泥”“聚羧酸”“0-5籽”）归到大类 */
const DEFAULT_MATERIALS = [
  { id:"cement", name:"水泥",  opening:0, warnLow:100, lossThreshold:1.5, aliases:["水泥","1线水泥","2线水泥","1仓","2仓"] },
  { id:"slag",   name:"矿粉",  opening:0, warnLow:80,  lossThreshold:1.5, aliases:["矿粉"] },
  { id:"flyash", name:"粉煤灰",opening:0, warnLow:80,  lossThreshold:2.0, aliases:["粉煤灰"] },
  { id:"expand", name:"膨胀剂",opening:0, warnLow:10,  lossThreshold:2.0, aliases:["膨胀剂"] },
  { id:"stpow",  name:"石粉",  opening:0, warnLow:50,  lossThreshold:2.0, aliases:["石粉"] },
  { id:"msand",  name:"机制砂",opening:0, warnLow:200, lossThreshold:3.0, aliases:["机制砂","粗砂","洗砂"] },
  { id:"fsand",  name:"细砂",  opening:0, warnLow:100, lossThreshold:3.0, aliases:["细砂","天然砂"] },
  { id:"gravel", name:"碎石",  opening:0, warnLow:200, lossThreshold:2.5, aliases:["碎石","0-5籽","1-2籽","0-5","石子"] },
  { id:"pebble", name:"卵石",  opening:0, warnLow:100, lossThreshold:2.5, aliases:["卵石"] },
  { id:"admix",  name:"外加剂",opening:0, warnLow:10,  lossThreshold:2.0, aliases:["外加剂","聚羧酸"] },
  { id:"eadmix", name:"早强剂",opening:0, warnLow:5,   lossThreshold:2.0, aliases:["早强","早强外加剂"] },
  { id:"diesel", name:"柴油",  opening:0, warnLow:2,   lossThreshold:1.0, aliases:["柴油","0#"] },
  { id:"urea",   name:"尿素",  opening:0, warnLow:1,   lossThreshold:2.0, aliases:["尿素"] },
];

let state = load();
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){ console.warn(e); }
  return normalize({});
}
function normalize(s){
  return {
    plantName: s.plantName || "未命名搅拌站",
    materials: (s.materials&&s.materials.length)? s.materials : structuredClone(DEFAULT_MATERIALS),
    daily:  s.daily  || [],   // {id,date,materialId,cons,inbound}  电脑消耗/进厂（吨）
    counts: s.counts || [],   // {id,date,materialId,actual,note}   实盘（吨）
    meta:   s.meta   || [],   // {id,date,volTotal,volC30,sales,note} 生产/销售方量
  };
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt = (n,d=2)=> (n==null||isNaN(n))?"—":Number(n).toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0 = n => fmt(n,0);
const today = ()=> new Date().toISOString().slice(0,10);
const mat = id => state.materials.find(m=>m.id===id);
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1900); }
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayAfter  = d=>{const x=new Date(d);x.setDate(x.getDate()+1);return x.toISOString().slice(0,10);};
const dayBefore = d=>{const x=new Date(d);x.setDate(x.getDate()-1);return x.toISOString().slice(0,10);};
function inRange(d,f,t){ if(f&&d<f)return false; if(t&&d>t)return false; return true; }

/* ================= 计算引擎 ================= */
const sumDaily=(mid,key,f,t)=> state.daily.filter(r=>r.materialId===mid&&inRange(r.date,f,t)).reduce((s,r)=>s+(+r[key]||0),0);

// 期初来源：截止 asOf(含) 最近一次盘点；无则材料期初
function openingAt(mid, asOf){
  const cs=state.counts.filter(c=>c.materialId===mid&&(!asOf||c.date<=asOf)).sort((a,b)=>a.date<b.date?1:-1);
  if(cs.length) return {value:+cs[0].actual, source:"盘点 "+cs[0].date};
  return {value:+(mat(mid).opening||0), source:"期初设置"};
}
// 账面库存（截止 asOf，默认至今）= 最近盘点(或期初) + 之后进厂 − 之后电脑消耗
function bookStock(mid, asOf){
  asOf = asOf || "9999-12-31";
  const cs=state.counts.filter(c=>c.materialId===mid&&c.date<=asOf).sort((a,b)=>a.date<b.date?1:-1);
  let base, from;
  if(cs.length){ base=+cs[0].actual; from=dayAfter(cs[0].date); }
  else { base=+(mat(mid).opening||0); from=null; }
  return base + sumDaily(mid,"inbound",from,asOf) - sumDaily(mid,"cons",from,asOf);
}
// 损耗分析
function lossAnalysis(from,to){
  return state.materials.map(m=>{
    const open=openingAt(m.id, from?dayBefore(from):null);
    const inbound=sumDaily(m.id,"inbound",from,to);
    const cons=sumDaily(m.id,"cons",from,to);          // 电脑消耗 = 理论应耗
    const ends=state.counts.filter(c=>c.materialId===m.id&&(!to||c.date<=to)&&(!from||c.date>=from)).sort((a,b)=>a.date<b.date?1:-1);
    const endCount=ends[0]||null;
    const book=bookStock(m.id,to);                      // 截止期末账面
    let actualUse=null,loss=null,rate=null,status="nodata";
    if(endCount){
      const endVal=+endCount.actual;
      actualUse=open.value+inbound-endVal;
      loss=actualUse-cons;
      rate=cons>0?(loss/cons*100):(loss!==0?Infinity:0);
      const th=+m.lossThreshold||0;
      status=(Math.abs(rate)===Infinity||Math.abs(rate)>th)?(rate>0?"over":"under"):"ok";
    }
    return {m,open,inbound,cons,endCount,book,actualUse,loss,rate,status};
  });
}

/* ================= 视图 ================= */
const TABS=[
  {id:"dash", label:"📊 总览"},
  {id:"daily",label:"📝 生产日报"},
  {id:"count",label:"📋 库存盘点"},
  {id:"loss", label:"🔍 损耗分析"},
  {id:"mats", label:"⚙️ 材料设置"},
];
let current="dash";
function renderTabs(){ document.getElementById("tabs").innerHTML=TABS.map(t=>`<button class="${t.id===current?'active':''}" onclick="go('${t.id}')">${t.label}</button>`).join(""); }
function go(id){ current=id; renderTabs(); render(); scrollTo(0,0); }
function render(){
  document.getElementById("plantName").textContent=state.plantName;
  document.getElementById("view").innerHTML=({dash:viewDash,daily:viewDaily,count:viewCount,loss:viewLoss,mats:viewMats}[current])();
  if(window["after_"+current]) window["after_"+current]();
}

/* ---------- 总览 ---------- */
function viewDash(){
  const cards=state.materials.map(m=>{
    const s=bookStock(m.id);
    const neg=s<-0.001, low=!neg && s<(m.warnLow||0);
    const cls=neg?"alert":low?"low":"";
    return `<div class="kpi ${cls}">
      <span class="bar"></span>
      <div class="name"><span class="mat-dot"></span>${m.name}</div>
      <div class="val num">${fmt(s)}<span class="unit">吨</span></div>
      <div class="meta">${neg?'⛔ 账面倒挂（进厂漏记/消耗虚高）':low?('⚠ 低于安全库存 '+fmt0(m.warnLow)):('安全库存 '+fmt0(m.warnLow)+'吨')}</div>
    </div>`;
  }).join("");
  const neg=state.materials.filter(m=>bookStock(m.id)<-0.001);
  const low=state.materials.filter(m=>{const s=bookStock(m.id);return s>=-0.001&&s<(m.warnLow||0);});
  const noCount=state.materials.filter(m=>!state.counts.some(c=>c.materialId===m.id));
  const totCons=state.daily.reduce((s,r)=>s+(+r.cons||0),0), totIn=state.daily.reduce((s,r)=>s+(+r.inbound||0),0);
  const vol=state.meta.reduce((s,m)=>s+(+m.volTotal||0),0);
  return `
  <div class="grid kpis">${cards}</div>
  <div class="split two">
    <div class="card"><h2>累计快照</h2><div class="sub">全部日报汇总（账面 = 期初 + 进厂 − 电脑消耗）</div>
      <table><tbody>
        <tr><td class="l">日报天数</td><td class="num">${new Set(state.daily.map(r=>r.date)).size} 天</td></tr>
        <tr><td class="l">累计进厂</td><td class="num">${fmt(totIn)} 吨</td></tr>
        <tr><td class="l">累计电脑消耗</td><td class="num">${fmt(totCons)} 吨</td></tr>
        <tr><td class="l">累计生产方量</td><td class="num">${fmt(vol)} m³</td></tr>
        <tr><td class="l">盘点记录</td><td class="num">${state.counts.length} 条</td></tr>
      </tbody></table>
    </div>
    <div class="card"><h2>待办与预警</h2><div class="sub">需要关注的事项</div>
      ${neg.length?`<div class="hint" style="border-color:var(--bad);color:var(--txt)"><b style="color:var(--bad)">⛔ 账面倒挂：</b>${neg.map(m=>m.name+'（'+fmt(bookStock(m.id))+'吨）').join('、')}。账面已为负，说明进厂漏记或电脑消耗虚高，务必核对过磅与主机数据。</div>`:''}
      ${low.length?low.map(m=>`<div class="chip" style="margin:0 6px 8px 0"><span class="mat-dot"></span>${m.name} 库存偏低</div>`).join(''):''}
      ${noCount.length?`<div class="hint">尚未盘点：${noCount.map(m=>m.name).join('、')}。<b>损耗分析需要盘点数据</b>——盘点后才能对比电脑消耗、发现跑冒滴漏。</div>`:''}
      ${(!neg.length&&!low.length&&!noCount.length)?'<div class="empty">一切正常 ✓</div>':''}
      <button class="btn" style="margin-top:6px" onclick="go('loss')">🔍 去做损耗分析</button>
    </div>
  </div>`;
}

/* ---------- 生产日报（核心录入，含粘贴导入） ---------- */
let dailyDate = today();
function viewDaily(){
  return `
  <div class="card">
    <h2>生产日报</h2>
    <div class="sub">按天录入各材料的「电脑消耗」（配料主机理论应耗）与「进厂」（过磅入库），单位：吨。账面库存自动滚动结转。</div>
    <div class="toolbar">
      <label class="field" style="max-width:180px"><span>日期</span><input type="date" id="dDate" value="${dailyDate}" onchange="dailyDate=this.value;render()"></label>
      <button class="btn ghost" onclick="importPaste()">📥 从粘贴表格填充</button>
      <div class="spacer"></div>
      <button class="btn" onclick="saveDaily()">保存本日</button>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th class="l">材料</th><th>电脑消耗 (吨)</th><th>进厂 (吨)</th><th>当日账面库存</th></tr></thead>
      <tbody>${state.materials.map(m=>{
        const r=state.daily.find(x=>x.date===dailyDate&&x.materialId===m.id)||{};
        const book=bookStock(m.id,dailyDate);
        return `<tr>
          <td class="l"><span class="mat-dot"></span>${m.name}</td>
          <td><input type="number" step="0.001" id="c_${m.id}" value="${r.cons??''}" placeholder="0"></td>
          <td><input type="number" step="0.001" id="i_${m.id}" value="${r.inbound??''}" placeholder="0"></td>
          <td class="num ${book<-0.001?'pos':''}">${fmt(book)}</td>
        </tr>`;}).join("")}</tbody>
    </table></div>

// 解析转置日报表：材料在列、指标在行。用“向右延续”处理合并表头，别名归大类。
function parseDailyTable(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim()!=="");
  const grid=lines.map(l=> l.includes("\t")? l.split("\t") : l.split(/ {2,}|，|,/)).map(r=>r.map(c=>c.trim()));
  const width=Math.max(0,...grid.map(r=>r.length));
  // 找指标行（这两行含数字、不是表头）
  const consRow=grid.find(r=>r.length>=3 && /电脑.*消耗|电脑总消耗|理论.*耗|应耗/.test(r[0]||""));
  const inRow  =grid.find(r=>r.length>=3 && /(日)?进厂|入库|进货/.test(r[0]||"") && !/月/.test(r[0]||""));
  const bound = consRow? grid.indexOf(consRow) : grid.length;   // 表头一定在指标行之上
  // 表头行：指标行之上、最靠上且材料命中≥2 的那一行（父级材料名行，避开仓/线子表头更靠下的干扰）
  let headerIdx=-1;
  for(let i=0;i<bound;i++){ if(grid[i].filter(c=>matchMat(c)).length>=2){ headerIdx=i; break; } }
  if(headerIdx<0){ let best=-1; grid.forEach((r,i)=>{const h=r.filter(c=>matchMat(c)).length; if(h>best){best=h;headerIdx=i;}}); }
  if(headerIdx<0) return {byMat:{},unmatched:[],note:"没识别到材料表头，请手动填写。"};
  // 列→大类：父级表头(headerIdx) 向右延续填补合并空格；仅当父级不匹配时才用子表头
  const h1=grid[headerIdx]||[], h2=(headerIdx+1<bound)? (grid[headerIdx+1]||[]) : [];
  const colMat=[]; let carry=null;
  for(let c=0;c<width;c++){
    const top=(h1[c]||"").trim(); if(top) carry=top;   // 记住合并父列（材料大类）名
    const sub=(h2[c]||"").trim();
    colMat[c] = matchMat(carry)? carry : (matchMat(sub)? sub : (carry||sub));
  }
  const consKg = consRow ? /kg|千克|公斤/.test(consRow[0]||"") : false;
  const inKg   = inRow ? /kg|千克|公斤/.test(inRow[0]||"") : false;
  const byMat={}, unmatched=new Set();
  for(let c=1;c<width;c++){
    const mid=matchMat(colMat[c]);
    if(!mid){ if(colMat[c]&&!/品种|规格/.test(colMat[c])) unmatched.add(colMat[c]); continue; }
    byMat[mid]=byMat[mid]||{cons:0,inbound:0,_c:false,_i:false};
    if(consRow){ const v=parseNum(consRow[c]); if(v!=null){ byMat[mid].cons+=consKg?v/1000:v; byMat[mid]._c=true; } }
    if(inRow){   const v=parseNum(inRow[c]);   if(v!=null){ byMat[mid].inbound+=inKg?v/1000:v; byMat[mid]._i=true; } }
  }
  Object.values(byMat).forEach(o=>{ if(!o._c)o.cons=null; if(!o._i)o.inbound=null; });
  const note = (consRow?'':"⚠ 未找到「电脑消耗」行；") + (inRow?'':"⚠ 未找到「进厂」行；")
    + `识别材料表头第 ${headerIdx+1} 行。请务必核对下方数字。`;
  return {byMat,unmatched:[...unmatched],note};
}
function matchMat(label){
  if(!label) return null; const s=String(label).replace(/\s/g,"");
  for(const m of state.materials){
    if(s.includes(m.name)||m.name.includes(s)) return m.id;
    for(const a of (m.aliases||[])){ if(a&&(s.includes(a)||a.includes(s))) return m.id; }
  }
  return null;
}
function parseNum(x){ if(x==null) return null; let s=String(x).trim().replace(/,/g,"");
  const neg=/^\(.*\)$/.test(s); s=s.replace(/[()（）]/g,""); if(s===""||isNaN(+s)) return null; return neg? -Math.abs(+s):+s; }

/* ---------- 库存盘点 ---------- */
function viewCount(){
  const rows=[...state.counts].sort((a,b)=>a.date<b.date?1:-1).map(c=>{
    const m=mat(c.materialId)||{name:'?'}; const book=bookAt(c.materialId,c.date,c.id); const diff=(+c.actual)-book;
    const cls=diff>0.001?'neg':diff<-0.001?'pos':'';
    return `<tr><td class="l">${c.date}</td><td class="l"><span class="mat-dot"></span>${m.name}</td>
      <td class="num">${fmt(book)}</td><td class="num"><b>${fmt(c.actual)}</b></td>
      <td class="num ${cls}">${diff>0?'+':''}${fmt(diff)}</td><td class="l muted">${esc(c.note||'')}</td>
      <td><div class="row-actions"><button class="btn ghost sm" onclick="editCount('${c.id}')">改</button>
        <button class="btn danger sm" onclick="del('counts','${c.id}')">删</button></div></td></tr>`;}).join("");
  return `<div class="card"><h2>库存盘点</h2>
    <div class="sub">录入实际过磅/测量的库存，系统对比账面差异。<b>盘点越勤，损耗发现越准。</b>差额为负=实盘少于账面（疑似损耗）。盘点后即成为后续账面的新基准。</div>
    <div class="toolbar"><button class="btn" onclick="editCount()">＋ 新增盘点</button></div>
    <div class="tablewrap">${state.counts.length?`<table>
      <thead><tr><th class="l">日期</th><th class="l">材料</th><th>账面库存</th><th>实盘库存</th><th>盈亏</th><th class="l">备注</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>`:`<div class="empty">还没有盘点记录。做一次盘点，就能启动损耗分析。</div>`}</div></div>`;
}
function bookAt(mid,date,excludeId){
  const prev=state.counts.filter(c=>c.materialId===mid&&c.id!==excludeId&&c.date<date).sort((a,b)=>a.date<b.date?1:-1);
  let base,from; if(prev.length){base=+prev[0].actual;from=dayAfter(prev[0].date);} else {base=+(mat(mid).opening||0);from=null;}
  return base + sumDaily(mid,"inbound",from,date) - sumDaily(mid,"cons",from,date);
}

function viewLoss(){
  const ds=[...state.daily,...state.counts].map(x=>x.date).sort();
  return `<div class="card"><h2>🔍 损耗分析 · 电脑消耗 vs 实际</h2>
    <div class="sub">实际消耗 = 期初 + 进厂 − 期末实盘；损耗 = 实际消耗 − 电脑消耗（理论应耗）。超阈值或账面倒挂即预警。</div>
    <div class="hint">口径：期初取区间开始前最近一次盘点（无则材料期初）；期末取区间内最近一次盘点。<b>没有盘点就得不出实际消耗</b>——请先到「库存盘点」录一次实盘。</div>
    <div class="toolbar">
      <label class="field" style="max-width:170px"><span>开始日期</span><input type="date" id="lossFrom" value="${ds[0]||today()}"></label>
      <label class="field" style="max-width:170px"><span>结束日期</span><input type="date" id="lossTo" value="${today()}"></label>
      <button class="btn" onclick="runLoss()">分析</button>
      <div class="spacer"></div><button class="btn ghost sm" onclick="print()">打印报表</button>
    </div><div id="lossResult"></div></div>`;
}
function after_loss(){ runLoss(); }
function runLoss(){
  const from=document.getElementById("lossFrom").value||null, to=document.getElementById("lossTo").value||null;
  const data=lossAnalysis(from,to); const any=data.some(d=>d.status!=="nodata");
  const rows=data.map(d=>{
    const st={ok:'<span class="tag ok">正常</span>',over:'<span class="tag bad">超耗预警</span>',
      under:'<span class="tag warn">异常偏少</span>',nodata:'<span class="tag mut">缺盘点</span>'}[d.status];
    const rt=d.rate==null?'—':(Math.abs(d.rate)===Infinity?'∞':(d.rate>0?'+':'')+fmt(d.rate,1)+'%');
    const lc=d.loss==null?'':d.loss>0?'pos':'neg';
    const negBook=d.book<-0.001?' <span class="tag bad" style="font-size:11px">倒挂</span>':'';
    return `<tr><td class="l"><span class="mat-dot"></span>${d.m.name}</td>
      <td class="num">${fmt(d.open.value)}<div class="muted" style="font-size:11px">${d.open.source}</div></td>
      <td class="num">${fmt(d.inbound)}</td><td class="num">${fmt(d.cons)}</td>
      <td class="num">${d.endCount?fmt(d.endCount.actual):'<span class="muted">无</span>'}${negBook}</td>
      <td class="num">${d.actualUse==null?'—':fmt(d.actualUse)}</td>
      <td class="num ${lc}"><b>${d.loss==null?'—':(d.loss>0?'+':'')+fmt(d.loss)}</b></td>
      <td class="num ${lc}">${rt}</td><td class="num muted">${fmt(d.m.lossThreshold,1)}%</td><td>${st}</td></tr>`;}).join("");
  const alerts=data.filter(d=>d.status==="over"||d.status==="under");
  const box=alerts.length?`<div class="hint" style="border-color:var(--bad);color:var(--txt)">
    <b style="color:var(--bad)">⚠ 发现 ${alerts.length} 项异常损耗：</b>
    ${alerts.map(d=>`${d.m.name}（${d.status==='over'?'超耗':'偏少'} ${Math.abs(d.rate)===Infinity?'∞':(d.rate>0?'+':'')+fmt(d.rate,1)+'%'}，${d.loss>0?'多耗':'少耗'} ${fmt(Math.abs(d.loss))}吨）`).join('；')}。
    <br>超耗常见原因：过磅作弊、装载/皮带跑冒、雨天砂含水虚增、配料机计量偏差、盗料；偏少多为进厂虚报或配比给料不足。建议核查过磅记录与主机计量。</div>`:'';
  document.getElementById("lossResult").innerHTML=`${box}<div class="tablewrap">${any?`<table>
    <thead><tr><th class="l">材料</th><th>期初</th><th>进厂</th><th>电脑消耗</th><th>期末实盘</th><th>实际消耗</th><th>损耗</th><th>损耗率</th><th>阈值</th><th>状态</th></tr></thead>
    <tbody>${rows}</tbody></table>`:`<div class="empty">当前区间没有盘点数据，无法计算实际消耗。请先到「库存盘点」录入一次实盘。</div>`}</div>
    <div class="legend"><span><i style="background:var(--bad)"></i>损耗为正 = 实际比理论多耗（疑似跑冒滴漏）</span><span><i style="background:var(--ok)"></i>损耗为负 = 比理论少耗</span></div>`;
}

      const name=gv("f_name"); if(!name){toast("请填写名称");return false;}
      const aliases=gv("f_alias").split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
      upsert("materials",{id:id||("m_"+uid()),name,opening:numv("f_open")||0,warnLow:numv("f_warn")||0,lossThreshold:numv("f_loss")||0,aliases}); toast("材料已保存");
  });
}
function editPlant(){ openDlg("修改站名",`<label class="field"><span>搅拌站名称</span><input id="f_pn" value="${esc(state.plantName)}"></label>`,()=>{ state.plantName=gv("f_pn")||"未命名搅拌站"; toast("已更新"); }); }

function upsert(coll,obj){ const a=state[coll],i=a.findIndex(x=>x.id===obj.id); if(i>=0)a[i]=obj; else a.push(obj); }
function del(coll,id){ if(!confirm("确定删除这条记录？")) return; state[coll]=state[coll].filter(x=>x.id!==id); save(); render(); toast("已删除"); }
function wipe(){ if(!confirm("将清空全部数据，无法恢复。确定？"))return; if(!confirm("再次确认：彻底清空？"))return;
  localStorage.removeItem(LS_KEY); state=normalize({}); save(); render(); toast("已清空"); }

/* ================= 备份 / CSV / 示例 ================= */
function exportBackup(){ download(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),`进销存备份_${today()}.json`); toast("已导出备份"); }
function importBackup(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{state=normalize(JSON.parse(r.result));save();render();toast("恢复成功");}catch(e){alert("文件格式错误");} inp.value=""; }; r.readAsText(f); }
function exportDailyCSV(){
  const header=["日期","材料","电脑消耗(吨)","进厂(吨)"];
  const rows=[...state.daily].sort((a,b)=>a.date<b.date?1:-1).map(r=>[r.date,mat(r.materialId)?.name||'',r.cons??'',r.inbound??'']);
  const csv=[header,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  download(new Blob(["﻿"+csv],{type:"text/csv"}),`日报_${today()}.csv`); toast("已导出CSV");
}
function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

function loadDemo(){
  if(state.daily.length&&!confirm("载入示例数据将覆盖材料期初并追加示例日报。继续？")) return;
  const d=off=>{const x=new Date();x.setDate(x.getDate()-off);return x.toISOString().slice(0,10);};
  state.materials=structuredClone(DEFAULT_MATERIALS).map(m=>({...m,opening:{cement:220,slag:180,flyash:150,expand:200,stpow:170,msand:2400,fsand:120,gravel:1780,pebble:56,admix:36,eadmix:6,diesel:3,urea:5}[m.id]||0}));
  // 20天日报：电脑消耗+进厂。机制砂故意让实际>电脑消耗（跑冒滴漏），其余正常
  state.daily=[]; state.meta=[];
  const consBase={cement:17.6,slag:0,flyash:5.0,expand:5.0,stpow:5.6,msand:79.2,fsand:0,gravel:83.1,pebble:0.2,admix:0.42,eadmix:0,diesel:0.05,urea:0.1};
  for(let k=19;k>=0;k--){ const date=d(k); const vol=80+Math.round(Math.random()*20);
    state.materials.forEach(m=>{ const c=(consBase[m.id]||0)*(0.9+Math.random()*0.2);
      const inb=(m.id==="msand"&&k%3===0)?360:(m.id==="cement"&&k%5===0)?150:(m.id==="gravel"&&k%3===1)?300:0;
      if(c>0||inb>0) state.daily.push({id:uid(),date,materialId:m.id,cons:+c.toFixed(3),inbound:inb}); });
    state.meta.push({id:uid(),date,volTotal:vol,volC30:Math.round(vol*0.85),sales:vol});
  }
  // 期末盘点：机制砂实盘明显偏少（多耗~10%，模拟跑冒滴漏），其余等于账面（损耗正常）
  const endDate=d(0);
  state.counts=state.materials.map(m=>{ const book=bookStock(m.id,endDate);
    const actual = m.id==="msand"? book*0.90 : book;   // 仅机制砂制造 10% 亏空
    return {id:uid(),date:endDate,materialId:m.id,actual:+Math.max(0,actual).toFixed(2),note:m.id==="msand"?"月末盘点：实盘明显偏少，疑似皮带撒漏/含水虚增":""}; });
  save(); render(); toast("示例数据已载入，去「损耗分析」看看");
}

/* 启动 */
document.getElementById("plantName").addEventListener("click",editPlant);
renderTabs(); render();
</script>
