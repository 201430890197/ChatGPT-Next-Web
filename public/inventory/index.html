<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>原材料进销存 · 混凝土搅拌站</title>
<style>
  :root{
    --bg:#0f1720; --panel:#17212b; --panel2:#1e2b38; --line:#2a3a4a;
    --txt:#e6edf3; --muted:#8aa0b4; --accent:#3d8bff; --accent2:#2563eb;
    --ok:#2ec27e; --warn:#f5a623; --bad:#ff5c5c; --chip:#22303d;
    --shadow:0 6px 24px rgba(0,0,0,.35);
    --sand:#e0b060; --stone:#9aa0a6; --cement:#7f8fa6; --flyash:#b98cff; --admix:#38c6c6;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f2f5f8; --panel:#ffffff; --panel2:#f7f9fb; --line:#e2e8ef;
      --txt:#1a2530; --muted:#617489; --chip:#eef3f8; --shadow:0 4px 18px rgba(20,40,70,.08);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  header.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:10px 18px;box-shadow:var(--shadow)}
  header .logo{font-weight:700;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:8px}
  header .logo .dot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
  header .plant{color:var(--muted);font-size:13px;border-left:1px solid var(--line);padding-left:14px}
  header .spacer{flex:1}
  header .tools{display:flex;gap:8px;flex-wrap:wrap}
  nav.tabs{display:flex;gap:4px;padding:8px 12px 0;background:var(--panel);border-bottom:1px solid var(--line);
    overflow-x:auto;position:sticky;top:53px;z-index:19}
  nav.tabs button{background:transparent;border:none;color:var(--muted);padding:9px 14px;border-radius:8px 8px 0 0;
    cursor:pointer;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
  nav.tabs button:hover{color:var(--txt);background:var(--panel2)}
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  main{max-width:1180px;margin:0 auto;padding:18px}
  .btn{background:var(--accent2);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;
    display:inline-flex;align-items:center;gap:6px}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--chip);color:var(--txt);border:1px solid var(--line)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
  .btn.danger:hover{background:rgba(255,92,92,.12)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:16px}
  .card .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .kpi .name{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:24px;font-weight:700;margin-top:6px}
  .kpi .unit{font-size:13px;color:var(--muted);font-weight:400;margin-left:3px}
  .kpi .meta{font-size:12px;color:var(--muted);margin-top:4px}
  .kpi.alert{border-color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  thead th{color:var(--muted);font-weight:600;font-size:12px;background:var(--panel2);position:sticky;top:0}
  tbody tr:hover{background:var(--panel2)}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-items:end}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
  label.field span b{color:var(--bad);font-weight:400}
  input,select,textarea{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:14px;font-family:inherit;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  input[readonly]{color:var(--muted);background:var(--chip)}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--chip);border:1px solid var(--line)}
  .tag{padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
  .tag.ok{background:rgba(46,194,126,.15);color:var(--ok)}
  .tag.warn{background:rgba(245,166,35,.15);color:var(--warn)}
  .tag.bad{background:rgba(255,92,92,.15);color:var(--bad)}
  .tag.mut{background:var(--chip);color:var(--muted)}
  .num{font-variant-numeric:tabular-nums}
  .pos{color:var(--bad)} .neg{color:var(--ok)}
  .muted{color:var(--muted)}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .empty{padding:36px;text-align:center;color:var(--muted)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .spacer{flex:1}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--txt);padding:0;
    box-shadow:var(--shadow);max-width:560px;width:92vw}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog .dhead{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center}
  dialog .dbody{padding:18px}
  dialog .dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .close{margin-left:auto;background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .bar-mini{height:7px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:6px}
  .bar-mini i{display:block;height:100%}
  .hint{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
    padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:99;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .split{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:820px){.split.two{grid-template-columns:1fr 1fr}}
  .mat-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  details.mixcard{border:1px solid var(--line);border-radius:10px;padding:0;margin-bottom:10px;background:var(--panel2)}
  details.mixcard summary{padding:12px 14px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:10px}
  details.mixcard .mixbody{padding:0 14px 14px}
  @media print{header.topbar,nav.tabs,.toolbar,.row-actions,.btn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><span class="dot"></span> 原材料进销存</div>
  <div class="plant" id="plantName" title="点击修改站名" style="cursor:pointer">未命名搅拌站</div>
  <div class="spacer"></div>
  <div class="tools">
    <button class="btn ghost sm" onclick="exportBackup()">导出备份</button>
    <button class="btn ghost sm" onclick="document.getElementById('importFile').click()">导入</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(this)"/>
    <button class="btn ghost sm" onclick="loadDemo()">示例数据</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div class="toast" id="toast"></div>

<!-- 通用编辑弹窗 -->
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <div class="dhead"><span id="dlgTitle">编辑</span><button type="button" class="close" onclick="document.getElementById('dlg').close()">×</button></div>
    <div class="dbody" id="dlgBody"></div>
    <div class="dfoot">
      <button type="button" class="btn ghost" onclick="document.getElementById('dlg').close()">取消</button>
      <button type="button" class="btn" id="dlgSave">保存</button>
    </div>
  </form>
</dialog>

<script>
/* =========================================================================
   原材料进销存 — 单文件应用（数据保存在浏览器本地 localStorage）
   材料：砂 石 水泥 粉煤灰 外加剂
   核心：进货过磅 → 库存 → 按配比计算理论消耗 → 与实盘对比 → 损耗预警
   ========================================================================= */

const LS_KEY = "rmi_inventory_v1";
const T = 1000; // 1吨 = 1000kg

/* ---------- 默认材料（可增改）。单位统一为“吨”。lossThreshold=损耗率预警阈值(%) ---------- */
const DEFAULT_MATERIALS = [
  { id:"sand",   name:"砂",     unit:"吨", color:"var(--sand)",   opening:0, warnLow:200, lossThreshold:3.0 },
  { id:"stone",  name:"石",     unit:"吨", color:"var(--stone)",  opening:0, warnLow:200, lossThreshold:2.5 },
  { id:"cement", name:"水泥",   unit:"吨", color:"var(--cement)", opening:0, warnLow:100, lossThreshold:1.5 },
  { id:"flyash", name:"粉煤灰", unit:"吨", color:"var(--flyash)", opening:0, warnLow:80,  lossThreshold:2.0 },
  { id:"admix",  name:"外加剂", unit:"吨", color:"var(--admix)",  opening:0, warnLow:10,  lossThreshold:2.0 },
];

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); return normalize(s); }
  }catch(e){ console.warn(e); }
  return normalize({});
}
function normalize(s){
  return {
    plantName: s.plantName || "未命名搅拌站",
    materials: (s.materials && s.materials.length) ? s.materials : structuredClone(DEFAULT_MATERIALS),
    purchases: s.purchases || [],   // 进货过磅 {id,date,materialId,supplier,vehicle,gross,tare,net,price,amount,note}
    mixes:     s.mixes     || [],   // 配比 {id,grade,name,ratios:{materialId:kgPerM3},note}
    productions:s.productions||[],  // 生产领用 {id,date,mixId,volume,note}
    counts:    s.counts    || [],   // 盘点 {id,date,materialId,actual,note}
  };
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt = (n,d=2)=> (n==null||isNaN(n))?"—":Number(n).toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0 = n => fmt(n,0);
const today = ()=> new Date().toISOString().slice(0,10);
const mat = id => state.materials.find(m=>m.id===id);
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }

/* ================= 计算引擎 ================= */

// 某材料在 [—,dateEnd] 区间的进货合计（吨）
function purchasedSum(materialId, from, to){
  return state.purchases
    .filter(p=>p.materialId===materialId && inRange(p.date,from,to))
    .reduce((s,p)=>s+(+p.net||0),0);
}
// 理论消耗（吨）：遍历生产记录，按配比 kg/m³ × 方量，再 /1000
function theoreticalUse(materialId, from, to){
  let kg = 0;
  for(const pr of state.productions){
    if(!inRange(pr.date,from,to)) continue;
    const mix = state.mixes.find(m=>m.id===pr.mixId);
    if(!mix) continue;
    const r = (mix.ratios && mix.ratios[materialId]) || 0;
    kg += r * (+pr.volume||0);
  }
  return kg / T;
}
function inRange(date, from, to){
  if(from && date < from) return false;
  if(to && date > to) return false;
  return true;
}
// 期初来源：截止 asOf(含) 之前最近一次盘点的实盘；无则用 material.opening
function openingAt(materialId, asOf){
  const cs = state.counts
    .filter(c=>c.materialId===materialId && (!asOf || c.date<=asOf))
    .sort((a,b)=> a.date<b.date?1:-1);
  if(cs.length) return { value:+cs[0].actual, source:"盘点("+cs[0].date+")", date:cs[0].date };
  return { value:+ (mat(materialId).opening||0), source:"期初设置", date:null };
}
// 账面库存（截止今天）：期初 + 进货 − 理论消耗；若期间有盘点则以最近盘点为新基准
function bookStock(materialId){
  const base = openingAt(materialId, null); // 若从没盘点，用 opening
  // 找最近一次盘点作为基准，之后的进货/理论消耗叠加
  const cs = state.counts.filter(c=>c.materialId===materialId).sort((a,b)=> a.date<b.date?1:-1);
  if(cs.length){
    const anchor = cs[0];
    const inc = purchasedSum(materialId, dayAfter(anchor.date), null);
    const use = theoreticalUse(materialId, dayAfter(anchor.date), null);
    return { value:(+anchor.actual)+inc-use, anchorDate:anchor.date, purchased:inc, used:use };
  }
  const inc = purchasedSum(materialId, null, null);
  const use = theoreticalUse(materialId, null, null);
  return { value:(mat(materialId).opening||0)+inc-use, anchorDate:null, purchased:inc, used:use };
}
function dayAfter(d){ const x=new Date(d); x.setDate(x.getDate()+1); return x.toISOString().slice(0,10); }

// 损耗分析：给定区间 [from,to]，返回每材料 {期初,进货,理论消耗,期末实盘,实际消耗,损耗,损耗率,状态}
function lossAnalysis(from, to){
  return state.materials.map(m=>{
    const open = openingAt(m.id, from ? dayBefore(from) : null);
    const purchased = purchasedSum(m.id, from, to);
    const theo = theoreticalUse(m.id, from, to);
    // 期末实盘：区间内(≤to)最近一次盘点
    const endCounts = state.counts.filter(c=>c.materialId===m.id && (!to||c.date<=to) && (!from||c.date>=from))
      .sort((a,b)=> a.date<b.date?1:-1);
    const endCount = endCounts[0] || null;
    let actualUse=null, loss=null, rate=null, status="nodata";
    if(endCount){
      const endVal = +endCount.actual;
      actualUse = open.value + purchased - endVal;         // 实际消耗
      loss = actualUse - theo;                              // 损耗（+超耗 -节余）
      rate = theo>0 ? (loss/theo*100) : (loss!==0? Infinity: 0);
      const th = +m.lossThreshold||0;
      if(Math.abs(rate)===Infinity || Math.abs(rate)>th) status = (rate>0?"over":"under");
      else status="ok";
    }
    return { m, opening:open, purchased, theo, endCount, actualUse, loss, rate, status };
  });
}
function dayBefore(d){ const x=new Date(d); x.setDate(x.getDate()-1); return x.toISOString().slice(0,10); }

/* ================= 视图路由 ================= */
const TABS = [
  {id:"dash",  label:"📊 总览"},
  {id:"buy",   label:"🚚 进货过磅"},
  {id:"mix",   label:"⚗️ 配比管理"},
  {id:"prod",  label:"🏭 生产领用"},
  {id:"count", label:"📋 库存盘点"},
  {id:"loss",  label:"🔍 损耗分析"},
  {id:"mats",  label:"⚙️ 材料设置"},
];
let current = "dash";
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(t=>
    `<button class="${t.id===current?'active':''}" onclick="go('${t.id}')">${t.label}</button>`).join("");
}
function go(id){ current=id; renderTabs(); render(); window.scrollTo(0,0); }
function render(){
  document.getElementById("plantName").textContent = state.plantName;
  const v = document.getElementById("view");
  v.innerHTML = ({dash:viewDash,buy:viewBuy,mix:viewMix,prod:viewProd,count:viewCount,loss:viewLoss,mats:viewMats}[current])();
  if(window["after_"+current]) window["after_"+current]();
}

/* ---------- 总览 ---------- */
function viewDash(){
  const cards = state.materials.map(m=>{
    const bs = bookStock(m.id);
    const low = bs.value < (m.warnLow||0);
    const cap = Math.max(bs.value, m.warnLow*2, 1);
    const pct = Math.max(0,Math.min(100, bs.value/cap*100));
    return `<div class="kpi ${low?'alert':''}">
      <span class="bar" style="background:${m.color}"></span>
      <div class="name"><span class="mat-dot" style="background:${m.color}"></span>${m.name}</div>
      <div class="val num">${fmt(bs.value)}<span class="unit">${m.unit}</span></div>
      <div class="bar-mini"><i style="width:${pct}%;background:${low?'var(--bad)':m.color}"></i></div>
      <div class="meta">${low?'⚠ 低于安全库存 '+fmt0(m.warnLow):'安全库存 '+fmt0(m.warnLow)+m.unit}</div>
    </div>`;
  }).join("");

  // 待办提醒：库存告警 + 从未盘点
  const lowItems = state.materials.filter(m=>bookStock(m.id).value < (m.warnLow||0));
  const noCount  = state.materials.filter(m=>!state.counts.some(c=>c.materialId===m.id));
  const totalBuy = state.purchases.reduce((s,p)=>s+(+p.amount||0),0);

  return `
  <div class="grid kpis">${cards}</div>

  <div class="split two">
    <div class="card">
      <h2>经营快照</h2>
      <div class="sub">账面数据（期初 + 进货 − 理论消耗；若有盘点则以最近盘点为基准）</div>
      <table><tbody>
        <tr><td class="l">进货单据</td><td class="num">${state.purchases.length} 单</td></tr>
        <tr><td class="l">进货金额合计</td><td class="num">¥ ${fmt(totalBuy)}</td></tr>
        <tr><td class="l">配比方案</td><td class="num">${state.mixes.length} 个</td></tr>
        <tr><td class="l">生产记录</td><td class="num">${state.productions.length} 条 / ${fmt(state.productions.reduce((s,p)=>s+(+p.volume||0),0))} m³</td></tr>
        <tr><td class="l">盘点记录</td><td class="num">${state.counts.length} 条</td></tr>
      </tbody></table>
    </div>
    <div class="card">
      <h2>待办与预警</h2>
      <div class="sub">需要关注的事项</div>
      ${lowItems.length? lowItems.map(m=>`<div class="chip" style="margin:0 6px 8px 0"><span class="mat-dot" style="background:${m.color}"></span>${m.name} 库存偏低</div>`).join("") : ''}
      ${noCount.length? `<div class="hint" style="margin-top:4px">尚未盘点：${noCount.map(m=>m.name).join("、")}。<b>损耗分析需要盘点数据</b>——盘点后才能对比理论用量、发现跑冒滴漏。</div>`:''}
      ${(!lowItems.length && !noCount.length)? '<div class="empty">一切正常 ✓</div>':''}
      <button class="btn" style="margin-top:6px" onclick="go('loss')">🔍 去做损耗分析</button>
    </div>
  </div>`;
}

/* ---------- 进货过磅 ---------- */
function viewBuy(){
  const rows = [...state.purchases].sort((a,b)=>a.date<b.date?1:-1).map(p=>{
    const m = mat(p.materialId)||{name:"?",unit:""};
    return `<tr>
      <td class="l">${p.date}</td>
      <td class="l"><span class="mat-dot" style="background:${m.color}"></span> ${m.name}</td>
      <td class="l">${esc(p.supplier||'')}</td>
      <td class="l">${esc(p.vehicle||'')}</td>
      <td class="num">${fmt(p.gross)}</td>
      <td class="num">${fmt(p.tare)}</td>
      <td class="num"><b>${fmt(p.net)}</b></td>
      <td class="num">${p.price?fmt(p.price):'—'}</td>
      <td class="num">${p.amount?'¥'+fmt(p.amount):'—'}</td>
      <td class="l muted">${esc(p.note||'')}</td>
      <td><div class="row-actions">
        <button class="btn ghost sm" onclick="editBuy('${p.id}')">改</button>
        <button class="btn danger sm" onclick="del('purchases','${p.id}')">删</button>
      </div></td></tr>`;
  }).join("");
  return `
  <div class="card">
    <h2>进货过磅记录</h2>
    <div class="sub">毛重 − 皮重 = 净重（入库量）。净重自动累加进库存。</div>
    <div class="toolbar">
      <button class="btn" onclick="editBuy()">＋ 新增过磅单</button>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="exportCSV('purchases')">导出CSV</button>
    </div>
    <div class="tablewrap">
    ${state.purchases.length? `<table>

/* ---------- 库存盘点 ---------- */
function viewCount(){
  const rows = [...state.counts].sort((a,b)=>a.date<b.date?1:-1).map(c=>{
    const m = mat(c.materialId)||{name:'?'};
    // 账面（截止盘点日）= 期初 + 进货 − 理论消耗（从上一盘点/期初起）
    const book = bookAt(c.materialId, c.date, c.id);
    const diff = (+c.actual) - book;
    const cls = diff>0.001?'neg':diff<-0.001?'pos':'';
    return `<tr>
      <td class="l">${c.date}</td>
      <td class="l"><span class="mat-dot" style="background:${m.color}"></span> ${m.name}</td>
      <td class="num">${fmt(book)}</td>
      <td class="num"><b>${fmt(c.actual)}</b></td>
      <td class="num ${cls}">${diff>0?'+':''}${fmt(diff)}</td>
      <td class="l muted">${esc(c.note||'')}</td>
      <td><div class="row-actions">
        <button class="btn ghost sm" onclick="editCount('${c.id}')">改</button>
        <button class="btn danger sm" onclick="del('counts','${c.id}')">删</button>
      </div></td></tr>`;
  }).join("");
  return `
  <div class="card">
    <h2>库存盘点</h2>
    <div class="sub">录入实际过磅/测量的库存，系统对比账面差异。<b>盘点越勤，损耗发现越准。</b>差额为负=实盘少于账面（疑似损耗）。</div>
    <div class="toolbar"><button class="btn" onclick="editCount()">＋ 新增盘点</button></div>
    <div class="tablewrap">
    ${state.counts.length? `<table>
      <thead><tr><th class="l">日期</th><th class="l">材料</th><th>账面库存</th><th>实盘库存</th><th>盈亏</th><th class="l">备注</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>` : `<div class="empty">还没有盘点记录。做一次盘点，就能启动损耗分析。</div>`}
    </div>
  </div>`;
}
// 截止某日的账面（排除指定盘点id自身，用于盘点表对比）
function bookAt(materialId, date, excludeCountId){
  const prevCounts = state.counts.filter(c=>c.materialId===materialId && c.id!==excludeCountId && c.date<date)
    .sort((a,b)=> a.date<b.date?1:-1);
  let baseVal, from;
  if(prevCounts.length){ baseVal=+prevCounts[0].actual; from=dayAfter(prevCounts[0].date); }
  else { baseVal=mat(materialId).opening||0; from=null; }
  return baseVal + purchasedSum(materialId, from, date) - theoreticalUse(materialId, from, date);
}

/* ---------- 损耗分析（核心） ---------- */
function viewLoss(){
  const dates = [...state.purchases,...state.productions,...state.counts].map(x=>x.date).sort();
  const from = dates[0]||today(), to=today();
  return `
  <div class="card">
    <h2>🔍 损耗分析 · 理论 vs 实际</h2>
    <div class="sub">实际消耗 = 期初 + 进货 − 期末实盘；损耗 = 实际消耗 − 理论消耗（配比×方量）。超过阈值即预警。</div>
    <div class="hint">
      口径说明：期初取区间开始前最近一次盘点（无则取“材料设置”里的期初）；期末取区间内最近一次盘点。
      <b>没有盘点就无法得出实际消耗</b>——请到「库存盘点」先录入一次实盘。
    </div>
    <div class="toolbar">
      <label class="field" style="max-width:170px"><span>开始日期</span><input type="date" id="lossFrom" value="${from}"></label>
      <label class="field" style="max-width:170px"><span>结束日期</span><input type="date" id="lossTo" value="${to}"></label>
      <button class="btn" onclick="runLoss()">分析</button>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="window.print()">打印报表</button>
    </div>
    <div id="lossResult"></div>
  </div>`;
}
function after_loss(){ runLoss(); }
function runLoss(){
  const from = document.getElementById("lossFrom").value || null;
  const to   = document.getElementById("lossTo").value || null;
  const data = lossAnalysis(from, to);
  const anyData = data.some(d=>d.status!=="nodata");
  const rows = data.map(d=>{
    const st = {
      ok:  `<span class="tag ok">正常</span>`,
      over:`<span class="tag bad">超耗预警</span>`,
      under:`<span class="tag warn">异常偏少</span>`,
      nodata:`<span class="tag mut">缺盘点</span>`
    }[d.status];
    const rateTxt = d.rate==null? '—' : (Math.abs(d.rate)===Infinity? '∞' : (d.rate>0?'+':'')+fmt(d.rate,1)+'%');
    const lossCls = d.loss==null?'':d.loss>0?'pos':'neg';
    return `<tr>
      <td class="l"><span class="mat-dot" style="background:${d.m.color}"></span> ${d.m.name}</td>
      <td class="num">${fmt(d.opening.value)}<div class="muted" style="font-size:11px">${d.opening.source}</div></td>
      <td class="num">${fmt(d.purchased)}</td>
      <td class="num">${fmt(d.theo)}</td>
      <td class="num">${d.endCount?fmt(d.endCount.actual):'<span class="muted">无</span>'}</td>
      <td class="num">${d.actualUse==null?'—':fmt(d.actualUse)}</td>
      <td class="num ${lossCls}"><b>${d.loss==null?'—':(d.loss>0?'+':'')+fmt(d.loss)}</b></td>
      <td class="num ${lossCls}">${rateTxt}</td>
      <td class="num muted">${fmt(d.m.lossThreshold,1)}%</td>
      <td>${st}</td>
    </tr>`;
  }).join("");

  const alerts = data.filter(d=>d.status==="over"||d.status==="under");
  const alertBox = alerts.length? `<div class="hint" style="border-color:var(--bad);color:var(--txt)">
     <b style="color:var(--bad)">⚠ 发现 ${alerts.length} 项异常损耗：</b>
     ${alerts.map(d=>`${d.m.name}（${d.status==='over'?'超耗':'偏少'} ${d.rate>0?'+':''}${Math.abs(d.rate)===Infinity?'∞':fmt(d.rate,1)}%，${d.loss>0?'多耗':'少耗'} ${fmt(Math.abs(d.loss))}${d.m.unit}）`).join("；")}。
     <br>超耗常见原因：过磅作弊、装载/皮带跑冒、雨天砂含水虚增、配料机计量偏差、盗料；偏少可能是进货虚报或配比给料不足。建议核查过磅记录与计量设备。
   </div>`:'';

  document.getElementById("lossResult").innerHTML = `
    ${alertBox}
    <div class="tablewrap">
    ${anyData? `<table>
      <thead><tr><th class="l">材料</th><th>期初</th><th>进货</th><th>理论消耗</th><th>期末实盘</th><th>实际消耗</th><th>损耗</th><th>损耗率</th><th>阈值</th><th>状态</th></tr></thead>
      <tbody>${rows}</tbody></table>`
    : `<div class="empty">当前区间没有盘点数据，无法计算实际消耗。<br>请先到「库存盘点」录入一次实盘。</div>`}
    </div>
    <div class="legend">
      <span><i style="background:var(--bad)"></i>损耗为正 = 实际比理论多耗（疑似跑冒滴漏）</span>
      <span><i style="background:var(--ok)"></i>损耗为负 = 比理论少耗</span>
    </div>`;
}

      <label class="field"><span>名称 <b>*</b></span><input id="f_name" value="${esc(m.name||'')}"></label>
      <label class="field"><span>单位</span><input id="f_unit" value="${esc(m.unit||'吨')}"></label>
      <label class="field"><span>期初库存</span><input type="number" step="0.01" id="f_open" value="${m.opening??0}"></label>
      <label class="field"><span>安全库存</span><input type="number" step="0.01" id="f_warn" value="${m.warnLow??0}"></label>
      <label class="field"><span>损耗率阈值 (%)</span><input type="number" step="0.1" id="f_loss" value="${m.lossThreshold??2}"></label>
      <label class="field"><span>颜色</span><input id="f_color" value="${esc(m.color||'var(--accent)')}"></label>
    </div>`, ()=>{
    const name=gv("f_name"); if(!name){ toast("请填写名称"); return false; }
    const obj={ id:id||("m_"+uid()), name, unit:gv("f_unit")||"吨", color:gv("f_color")||"var(--accent)",
      opening:gvn("f_open")||0, warnLow:gvn("f_warn")||0, lossThreshold:gvn("f_loss")||0 };
    upsert("materials",obj); toast("材料已保存");
  });
}
function editPlant(){
  openDlg("修改站名", `<label class="field"><span>搅拌站名称</span><input id="f_pn" value="${esc(state.plantName)}"></label>`, ()=>{
    state.plantName = gv("f_pn")||"未命名搅拌站"; toast("已更新");
  });
}

/* ================= 通用增删 ================= */
function upsert(coll, obj){
  const arr = state[coll]; const i = arr.findIndex(x=>x.id===obj.id);
  if(i>=0) arr[i]=obj; else arr.push(obj);
}
function del(coll, id){
  if(!confirm("确定删除这条记录？删除后不可恢复。")) return;
  state[coll] = state[coll].filter(x=>x.id!==id); save(); render(); toast("已删除");
}
function wipe(){
  if(!confirm("将清空所有材料、进货、配比、生产、盘点数据，无法恢复。确定？")) return;
  if(!confirm("再次确认：彻底清空？")) return;
  localStorage.removeItem(LS_KEY); state=normalize({}); save(); render(); toast("已清空");
}

/* ================= 导入导出 / 示例 ================= */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  download(blob, `进销存备份_${today()}.json`); toast("已导出备份");
}
function importBackup(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ state=normalize(JSON.parse(r.result)); save(); render(); toast("导入成功"); }
    catch(e){ alert("文件格式错误，导入失败"); } input.value=""; };
  r.readAsText(f);
}
function exportCSV(coll){
  let header, rows;
  if(coll==="purchases"){
    header=["日期","材料","供应商","车号","毛重","皮重","净重","单价","金额","备注"];
    rows=state.purchases.map(p=>[p.date,mat(p.materialId)?.name||'',p.supplier||'',p.vehicle||'',p.gross??'',p.tare??'',p.net??'',p.price??'',p.amount??'',p.note||'']);
  }else if(coll==="productions"){
    header=["日期","配比","方量"];
    rows=state.productions.map(pr=>{const m=state.mixes.find(x=>x.id===pr.mixId);return [pr.date,(m?.grade||'')+' '+(m?.name||''),pr.volume??''];});
  }
  const csv=[header,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  download(new Blob(["﻿"+csv],{type:"text/csv"}), `${coll}_${today()}.csv`); toast("已导出CSV");
}
function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

/* ================= 工具 ================= */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
document.getElementById("plantName").addEventListener("click", editPlant);

/* 启动 */
renderTabs(); render();
</script>
